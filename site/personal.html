<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guy — Notes &amp; Todos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Dashboard</a>
    <a href="personal.html" class="active">Notes &amp; Todos</a>
  </nav>

  <header class="header">
    <div>
      <p class="eyebrow">Mindful Design</p>
      <h1>Notes &amp; Todos</h1>
    </div>
    <div class="header-meta" id="personal-meta">Loading…</div>
  </header>

  <main class="grid personal-grid">
    <section class="card">
      <h2>Notes</h2>
      <p class="source-hint">Synced from <code>data/notes.md</code></p>
      <div class="markdown-body" id="notes">Loading…</div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Todo list</h2>
        <span class="badge" id="todo-count"></span>
      </div>
      <p class="source-hint">Synced from <code>data/todos.md</code></p>
      <ul class="todo-list" id="todos"></ul>
    </section>
  </main>

  <footer class="footer">
    <span id="sync-meta"></span>
  </footer>

  <script src="personal.js"></script>
</body>
</html>
